server {
    listen 80;
    server_name _;
    server_tokens off;

    # The React build (frontend/dist), mounted read-only.
    root /usr/share/nginx/html;
    index index.html;

    # Request bodies are small everywhere (JSON of a few KB) except for the upload endpoint, so that
    # nobody can push ~100 MB to the login or any other path for PHP to buffer and decode. Larger
    # bodies get nginx's own 413 page (HTML), which the frontend treats as payload_too_large.
    client_max_body_size 1m;

    # A 99 MB upload over a slow connection takes minutes: the 60 s defaults would cut it off.
    # 300 s matches the host nginx (see docs/deployment.md). client_body_timeout is the
    # gap allowed between two reads of the request body, not the total upload time.
    client_body_timeout 300s;

    # Declared only at server level on purpose: an add_header inside a location
    # would replace these instead of adding to them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # JSON is left out on purpose (BREACH: responses carry the CSRF token).
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript image/svg+xml;

    # Docker's embedded DNS. PHP is looked up per request (see $php_upstream) so
    # recreating the php container does not leave nginx pointing at its old address.
    resolver 127.0.0.11 valid=10s;

    # The only route that takes a file (POST /api/files): MAX_UPLOAD_BYTES (99 MB) + 10 MB for
    # multipart overhead. An exact match, so it wins over `^~ /api/` below; same FastCGI settings.
    location = /api/files {
        client_max_body_size 110m;
        set $php_upstream php:9000;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass $php_upstream;
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
    }

    location ^~ /api/ {
        set $php_upstream php:9000;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass $php_upstream;
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri /index.html;
    }

    # Scripts and styles (the entry and the lazy chunks) are never answered with the SPA page:
    # a missing chunk must be a 404, not HTML that the browser then fails to run. `expires` adds
    # no add_header, so the server-level security headers still apply.
    # Production names carry a content hash (20 hex digits), so a cached copy is never stale and
    # may be kept for a year; the unhashed names of a development build are not cached.
    location ~* "\.[0-9a-f]{20}\.(?:js|css)$" {
        try_files $uri =404;
        expires 1y;
    }

    location ~* \.(?:js|css|map)$ {
        try_files $uri =404;
    }

    # Never cache the entry point, so a rebuild is picked up straight away.
    location = /index.html {
        expires -1;
    }
}
