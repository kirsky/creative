; Application settings layered over the official image defaults.
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/stderr
error_reporting = E_ALL
date.timezone = UTC
memory_limit = 256M

; Uploads: MAX_UPLOAD_BYTES is 99000000 bytes (about 94.4 MiB), so 99M per file
; leaves room, and post_max_size matches nginx client_max_body_size (110m).
file_uploads = On
upload_max_filesize = 99M
post_max_size = 110M
max_file_uploads = 25

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
