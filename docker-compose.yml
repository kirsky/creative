name: creative

services:
  db:
    image: mariadb:12.3
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is not set, run `make init`}
      MARIADB_DATABASE: ${DB_NAME:-creative}
      MARIADB_USER: ${DB_USER:-creative}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set, run `make init`}
      DB_TEST_NAME: ${DB_TEST_NAME:-creative_test}
      # So that `docker compose exec db mariadb` logs in as root without a prompt.
      MYSQL_PWD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is not set, run `make init`}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db/creative.cnf:/etc/mysql/conf.d/creative.cnf:ro
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  php:
    build:
      context: ./docker/php
      args:
        APP_UID: ${HOST_UID:-1000}
        APP_GID: ${HOST_GID:-1000}
        UPLOAD_DIR: ${UPLOAD_DIR:-/var/uploads}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-demo}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-creative}
      DB_TEST_NAME: ${DB_TEST_NAME:-creative_test}
      DB_USER: ${DB_USER:-creative}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set, run `make init`}
      UPLOAD_DIR: ${UPLOAD_DIR:-/var/uploads}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-99000000}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-1}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
    volumes:
      - ./backend:/var/www/backend
      - uploads:${UPLOAD_DIR:-/var/uploads}
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.30.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - php

  # Tool-only services, never started by `make up`.
  node:
    profiles: ["tools"]
    build:
      context: ./docker/node
      args:
        APP_UID: ${HOST_UID:-1000}
        APP_GID: ${HOST_GID:-1000}
    working_dir: /app
    volumes:
      - ./frontend:/app

  playwright:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.65.0-noble
    init: true
    ipc: host
    working_dir: /app
    environment:
      BASE_URL: http://nginx
    volumes:
      - ./frontend:/app
    depends_on:
      - nginx

volumes:
  db_data:
  uploads:
